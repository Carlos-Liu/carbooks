# Build and unit-test backend (.NET) and frontend (Vitest) in parallel,
# upload coverage to Codecov, and keep reports as workflow artifacts.

name: CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebAPI
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # Matches TargetFramework in Directory.Build.props (net10.0).
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore CarBooks.slnx
    - name: Build
      run: dotnet build CarBooks.slnx --no-restore --configuration Release
    - name: Backend unit test with coverage
      run: >
        dotnet test CarBooks.slnx
        --no-build
        --configuration Release
        --verbosity normal
        --collect:"XPlat Code Coverage"
        --results-directory ./TestResults
        --settings coverlet.runsettings
    - name: Upload backend coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: src/WebAPI/TestResults/**/coverage.cobertura.xml
        flags: backend
        name: backend
        fail_ci_if_error: true
    - name: Upload backend coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-coverage
        path: src/WebAPI/TestResults/**/coverage.cobertura.xml
        if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/WebApp
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        # Matches engines.node in package.json (>=22.22.0).
        node-version: 22
        cache: npm
        cache-dependency-path: src/WebApp/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Frontend unit test with coverage
      run: npm run test:coverage
    - name: Upload frontend coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: src/WebApp/coverage/lcov.info
        flags: frontend
        name: frontend
        fail_ci_if_error: true
    - name: Upload frontend coverage artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-coverage
        path: src/WebApp/coverage
        if-no-files-found: warn
